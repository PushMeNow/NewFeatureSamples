name: kafka-infra

networks:
    common-network:
    kafka-internal:
        internal: true

volumes:
    kafka_data:
        driver: local

services:
    kafka-ui: # KafkaUI represents comfortable way to manage Kafka by GUI
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        ports:
            - "8080:8080"
        environment:
            DYNAMIC_CONFIG_ENABLED: 'true'
        volumes:
            - ./kafka-ui/config.yml:/etc/kafkaui/dynamic_config.yaml
        networks:
            - common-network
            - kafka-internal
        depends_on:
            - bitnami-kafka

    bitnami-kafka: # Bitnami includes kafka and zookeper which represent powerful tool to deploy whole kafka infrastructure
        image: docker.io/bitnami/kafka:latest
        ports:
            - "9092:9092"
            - "9094:9094"
        volumes:
            - kafka_data:/bitnami
        environment:
            KAFKA_ENABLE_KRAFT: yes
            KAFKA_CFG_PROCESS_ROLES: broker,controller
            KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
            KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,EXTERNAL://host.docker.internal:9094
            KAFKA_BROKER_ID: 1
            KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
            ALLOW_PLAINTEXT_LISTENER: yes
            KAFKA_CFG_NODE_ID: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
            BITNAMI_DEBUG: yes
            KAFKA_CFG_NUM_PARTITIONS: 2
            KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
            KAFKA_ZOOKEEPER_PROTOCOL: PLAINTEXT
        networks:
            - common-network
            - kafka-internal